<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Quishing Inspector</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand mb-0 h1">
            🛡️ QR Quishing Inspector
        </span>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="text-center">
                Scan QR Codes Safely
            </h2>

            <p class="text-center text-muted">
                Scan a QR code and check whether it is safe before opening it.
            </p>

            <div class="text-center mt-4">
                <div class="text-center">

    <video id="camera" width="100%" autoplay playsinline></video>
    <canvas id="qrCanvas" style="display: none;"></canvas>

    <div class="mt-3">
        <button id="startCamera" class="btn btn-primary">
            📷 Start Camera
        </button>

        <button id="stopCamera" class="btn btn-danger" disabled>
            ⏹ Stop Camera
        </button>
    </div>

    <div id="scanResult" class="alert alert-secondary mt-3">
        Camera is not started.
    </div>

</div>

            </div>

        </div>

    </div>

</div>
<script>
    const video = document.getElementById("camera");
    const startButton = document.getElementById("startCamera");
    const stopButton = document.getElementById("stopCamera");
    const scanResult = document.getElementById("scanResult");

    let cameraStream = null;

    startButton.addEventListener("click", async () => {

        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: "environment"
                },
                audio: false
            });

            video.srcObject = cameraStream;

            startButton.disabled = true;
            stopButton.disabled = false;

            scanResult.textContent = "Camera started. Point it at a QR code.";
           scanForQRCode();

        } catch (error) {

            console.error(error);

            scanResult.textContent =
                "Unable to access the camera. Please allow camera permission.";
        }
    });
function scanForQRCode() {

    if (!cameraStream) {
        return;
    }

    // Wait until the camera video has a usable size
    if (video.videoWidth === 0 || video.videoHeight === 0) {
        requestAnimationFrame(scanForQRCode);
        return;
    }

    const canvas = document.getElementById("qrCanvas");
    const context = canvas.getContext("2d", {
        willReadFrequently: true
    });

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const imageData = context.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const qrCode = jsQR(
        imageData.data,
        imageData.width,
        imageData.height
    );

    if (qrCode) {

        scanResult.textContent =
            "QR Code detected: " + qrCode.data;

        console.log("QR Code detected:", qrCode.data);

        return;
    }

    requestAnimationFrame(scanForQRCode);
}
   
    stopButton.addEventListener("click", () => {

        if (cameraStream) {

            cameraStream.getTracks().forEach(track => track.stop());

            cameraStream = null;
            video.srcObject = null;
        }

        startButton.disabled = false;
        stopButton.disabled = true;

        scanResult.textContent = "Camera stopped.";
    });
</script>
</body>
</html>
